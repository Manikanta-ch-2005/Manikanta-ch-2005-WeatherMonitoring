<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart AirNet | Bantakal Weather Node</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">

    <style>
        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .header {
            background: #111827;
            padding: 1.5rem;
            text-align: center;
        }

        .header-title {
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .header-subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .url-box {
            margin: 1rem auto;
            max-width: 900px;
            padding: 0.8rem;
            background: white;
            border-radius: 8px;
            word-break: break-all;
        }

        .targets {
            max-width: 900px;
            margin: auto;
            padding: 1rem;
        }

        .target-button {
            margin-bottom: 0.6rem;
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="header-title">
            Smart AirNet
        </div>

        <div class="header-subtitle">
            Real-Time Air Quality & Weather Monitor
        </div>

        <div class="url-box">
            <strong>Weather Monitoring Node:</strong><br>
            <code>
                {{ global.remoteURL }}/weather-monitoring-bantakal-node
            </code>
        </div>

    </header>


    <section id="tar-content" class="targets">

        <h1 class="title is-5">
            Bantakal Weather Nodes
        </h1>

        {{ for(value, key in TARGETS) }}

        <a href="/map?id={{ key }}"
           class="button is-fullwidth is-link target-button">

            {{ key }}

        </a>

        {{/}}

    </section>


    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>

    <script>

        const content = document.querySelector("#tar-content")

        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket']
        })


        socket.on("user-connected", newId => {

            const a = document.createElement("a")

            a.href = `/map?id=${newId}`

            a.className =
                "button is-fullwidth is-link target-button"

            a.innerText = newId

            content.appendChild(a)

        })

    </script>

</body>

</html>
